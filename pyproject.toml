[project]
name = "unknownlang"
version = "0.1.0"
description = "UnknownLang - Adaptive AI reasoning benchmark platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "lark>=1.1.0",
    "hypothesis>=6.98.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
]

[project.scripts]
unknownlang = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --strict-markers"

[tool.hypothesis]
max_examples = 100
seed = 42
verbosity = "normal"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
